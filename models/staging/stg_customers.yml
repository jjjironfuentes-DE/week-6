version: 2

models:
  - name: stg_customers
    description: "Staging model for customer data"

    columns:
      - name: customer_id
        description: "Unique identifier for each customer"
        data_tests:
          - unique
          - not_null

      - name: customer_name
        description: "Full name of the customer"
        data_tests:
          - not_null

      - name: email
        description: "Email address of the customer"
        data_tests:
          - not_null

      - name: city
        description: "City where the customer lives"
        data_tests:
          - not_null

      - name: signup_date
        description: "Date when the customer registered"
        data_tests:
          - not_null